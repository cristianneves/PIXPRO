# Test Configuration - overrides main application.properties

# Database configuration for H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT configuration (test key)
jwt.secret.key=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1taW5pbXVtLTMyLWJ5dGVzLWxvbmc=

# MinIO test configuration
aws.s3.endpoint=http://localhost:9000
aws.s3.bucket-name=pixpro-images-test
aws.region=us-east-1
aws.s3.access-key-id=minioadmin
aws.s3.secret-access-key=minioadmin

# Kafka test configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=pixpro-test-consumer
kafka.topics.image-processing-queue=image-processing-queue-test
kafka.topics.image-processing-result=image-processing-result-test

# Application name
spring.application.name=project-service-test

# Disable Eureka for tests
spring.kafka.admin.auto-create=false
eureka.client.enabled=false
