# ===============================================
# CONFIGURACAO DA APLICACAO
# ===============================================
# Nome inico do servico no Eureka
spring.application.name=project-service
# Porta diferente para o servico web para evitar conflito com o auth-service
server.port=8082
# Endereco do Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===============================================
# CONFIGURACAO DO BANCO DE DADOS (POSTGRESQL)
# ===============================================
# Conecta na porta 5433, que mapeamos no Docker Compose para o banco deste servico
spring.datasource.url=jdbc:postgresql://localhost:5433/pixpro_project_db
spring.datasource.username=postgres
spring.datasource.password=admin

# ===============================================
# CONFIGURACAO DO HIBERNATE (JPA)
# ===============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================================
# CONFIGURACAO DO JWT
# ===============================================
# A chave secreta DEVE ser identica ao do auth-service
jwt.secret.key=a2a6293f7f22f87a87c061b52a201c8286add5f7a083f2a3f7f87c061b52a201

# ===============================================
# CONFIGURACAO DE UPLOAD DE ARQUIVOS
# ===============================================
# Define o tamanho maximo por arquivo (ex: 10 Megabytes)
spring.servlet.multipart.max-file-size=10MB
# Define o tamanho maximo total da requisiCAo (ex: 50 Megabytes para multiplos arquivos)
spring.servlet.multipart.max-request-size=50MB

# ===============================================
# CONFIGURACAO DO MINIO (ARMAZENAMENTO S3)
# ===============================================

# Endereco da API do nosso servidor MinIO
aws.s3.endpoint=http://localhost:9000

# NOVO: Endereco EXTERNO/PUBLICO da API (para S3Presigner, links para o navegador)
aws.s3.public-endpoint=http://localhost:9000

# Nome do bucket que criamos para armazenar as imagens
aws.s3.bucket-name=pixpro-images

# Chave de acesso do MinIO (definida no docker-compose.yml)
aws.s3.access-key-id=minioadmin

# Chave secreta do MinIO (definida no docker-compose.yml)
aws.s3.secret-access-key=minioadmin

# A regiao e obrigatoria para o SDK, mesmo para um endpoint local
aws.region=us-east-1